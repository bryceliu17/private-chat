services:
  postgres:
    image: postgres:17
    container_name: private-chat-postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_chat -d private_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
