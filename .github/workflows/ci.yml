name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Check backend syntax
        run: |
          node --check server/index.js
          node --check server/auth.js
          node --check server/config.js
          node --check server/db.js
          node --check server/encryption.js
          node --check server/messages.js
          node --check server/payments.js
          node --check server/presence.js
          node --check server/security.js
          node --check server/sockets.js
          node --check server/storage.js

      - name: Run backend tests
        run: npm test
        working-directory: server

      - name: Build frontend
        run: npm run build
        working-directory: client

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e

            cd "${{ secrets.EC2_DEPLOY_PATH }}"

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm ci --prefix server
            npm ci --prefix client
            npm run build --prefix client

            pm2 describe private-chat-api >/dev/null
            pm2 restart private-chat-api --update-env
            pm2 save

            sudo nginx -t
            sudo systemctl reload nginx
